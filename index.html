```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes System Design</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>QuickNotes</h1>
            <p>Manage your notes using an API.</p>
        </header>

        <section class="panel">
            <h2>Your Notes</h2>

            <button type="button" id="load-btn">Load notes</button>
            <p id="status" role="status" aria-live="polite"></p>

            <ul id="notes-list"></ul>
        </section>

        <section class="panel">
            <h2>Create a Note</h2>

            <form id="note-form">
                <label for="title-input">Title</label>
                <input
                    type="text"
                    id="title-input"
                    maxlength="100"
                    required
                >

                <label for="body-input">Note body (optional)</label>
                <textarea id="body-input" rows="4"></textarea>

                <button type="submit" id="submit-btn">Create note</button>
            </form>
        </section>
    </main>
</body>
</html>
```
